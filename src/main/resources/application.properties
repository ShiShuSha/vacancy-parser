spring.application.name=Parser
server.port=8080

# H2 (встроенная база данных в памяти)
spring.datasource.url=jdbc:h2:mem:vacancydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Консоль H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Кастомный пул потоков
parser.executor.core-size=4
parser.executor.max-size=8
parser.executor.queue-capacity=100

# Собственное файловое хранилище истории разборов:
# события пишет отдельный демон-поток через блокирующую очередь
parser.history.file=data/parse-history.log
parser.history.queue-capacity=200

# Сколько ждать синхронный POST /api/vacancies/parse
parser.job.timeout-seconds=40

# Планировщик повторяет неудачные задачи
parser.retry.max-attempts=3
parser.retry.delay-seconds=30
parser.retry.delay-ms=60000
parser.retry.initial-delay-ms=30000
